name: Python tests

on:
  push:
    branches:
      - feature/aniworld-integration
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile application and tests
        run: python -m compileall -q app.py catalog_db.py playback_events.py simkl_tracking.py identity_resolver.py metadata_enricher.py providers tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
